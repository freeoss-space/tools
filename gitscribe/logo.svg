<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitScribe animated mascot face</title>
  <desc id="desc">Playful purple face inspired by git branching with blinking eyes and rotating gradient halo.</desc>
  <defs>
    <linearGradient id="faceGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 128 128" to="360 128 128" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 112) rotate(90) scale(52)">
      <stop offset="0%" stop-color="#ede9fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="64" fill="url(#faceGradient)"/>
  <path d="M76 80 L128 48 L180 80 L180 136 L128 168 L76 136 Z" stroke="#ddd6fe" stroke-width="6" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="96" cy="116" r="22" fill="url(#eyeGlow)"/>
  <circle cx="160" cy="116" r="22" fill="url(#eyeGlow)"/>

  <g filter="url(#softGlow)">
    <ellipse cx="96" cy="116" rx="10" ry="10" fill="#faf5ff">
      <animate attributeName="ry" values="10;10;1.5;10;10" keyTimes="0;0.42;0.5;0.58;1" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="160" cy="116" rx="10" ry="10" fill="#faf5ff">
      <animate attributeName="ry" values="10;10;1.5;10;10" keyTimes="0;0.42;0.5;0.58;1" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="92" cy="112" r="2.4" fill="#4c1d95"/>
    <circle cx="156" cy="112" r="2.4" fill="#4c1d95"/>
  </g>

  <g opacity="0.8" fill="#c4b5fd">
    <circle cx="54" cy="164" r="5">
      <animate attributeName="cy" values="168;156;168" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="202" cy="176" r="4">
      <animate attributeName="cy" values="182;166;182" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
