<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitScribe animated mascot face with git branch motif">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#8b5cf6;#7c3aed;#a78bfa" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#8b5cf6;#a78bfa;#7c3aed" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="104" fill="url(#bg-gradient)"/>
  <circle cx="128" cy="128" r="102" stroke="#ddd6fe" stroke-width="2" opacity="0.6"/>

  <!-- git branch motif -->
  <g aria-label="git branch" fill="#ede9fe" filter="url(#glow)">
    <circle cx="86" cy="180" r="9"/>
    <circle cx="128" cy="160" r="8"/>
    <circle cx="170" cy="178" r="9"/>
    <path d="M94 177C108 172 117 168 120 163C122 160 123 157 124 152" stroke="#ede9fe" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M136 159C146 163 154 168 162 174" stroke="#ede9fe" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <g class="eye-group">
    <circle id="eye-left" class="eye" cx="95" cy="104" r="17" fill="#111827"/>
    <circle id="eye-right" class="eye" cx="161" cy="104" r="17" fill="#111827"/>
    <circle cx="100" cy="98" r="5" fill="#ffffff">
      <animate attributeName="cy" values="98;100;98" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="98" r="5" fill="#ffffff">
      <animate attributeName="cy" values="98;100;98" dur="3s" repeatCount="indefinite"/>
    </circle>
    <rect x="78" y="100" width="34" height="10" rx="5" fill="#111827">
      <animate attributeName="height" values="10;2;10" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="144" y="100" width="34" height="10" rx="5" fill="#111827">
      <animate attributeName="height" values="10;2;10" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
