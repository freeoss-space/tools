<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitScribe Mascot</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <main class="stage">
    <section class="face" aria-label="GitScribe mascot face">
      <div class="git-ring"></div>
      <div class="bubble bubble-left"></div>
      <div class="bubble bubble-right"></div>
      <div class="eyes">
        <div class="eye"><span class="spark"></span></div>
        <div class="eye"><span class="spark"></span></div>
      </div>
    </section>
  </main>
  <script type="module" src="./assets/app.js"></script>
</body>
</html>
