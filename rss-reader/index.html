<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RSS Reader</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <header class="top-bar">
      <a href="../index.html" class="back-link" title="Back to Tools">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <button id="btn-sidebar-toggle" class="icon-btn sidebar-toggle" title="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="app-title">RSS Reader</h1>
      <div class="top-actions">
        <button id="btn-sync" class="icon-btn" title="Sync all feeds">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button id="btn-mark-all" class="icon-btn" title="Mark all as read">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </button>
        <button id="btn-menu" class="icon-btn" title="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </div>
    </header>

    <!-- Sidebar / nav -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-filter="all">All</button>
        <button class="sidebar-tab" data-filter="unread">Unread Only</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-heading">Feeds</div>
        <div id="nav-all" class="nav-item active" data-view="all">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2"/><path d="M6 10a8 8 0 0 1 8 8"/><path d="M6 2a16 16 0 0 1 16 16"/></svg>
          <span>All Feeds</span>
          <span class="badge" id="badge-all"></span>
        </div>
        <div id="feed-tree"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-heading">
          Read Lists
          <button id="btn-add-readlist" class="mini-btn" title="New read list">+</button>
        </div>
        <div id="readlist-nav"></div>
      </div>
    </nav>

    <!-- Main content -->
    <main id="main-content" class="main-content">
      <div id="article-list" class="article-list"></div>
      <div id="empty-state" class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5"><circle cx="6" cy="18" r="2"/><path d="M6 10a8 8 0 0 1 8 8"/><path d="M6 2a16 16 0 0 1 16 16"/></svg>
        <p>No articles yet. Add a feed to get started!</p>
      </div>
    </main>
  </div>

  <!-- Floating add button -->
  <button id="fab-add" class="fab" title="Add feed">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- Add feed modal -->
  <div id="modal-add" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Add Feed</h2>
        <button class="modal-close" data-close="modal-add">&times;</button>
      </div>
      <div class="modal-body">
        <div id="add-step-url" class="add-step">
          <label>Feed or Website URL</label>
          <div class="input-row">
            <input type="url" id="input-feed-url" placeholder="https://example.com/feed.xml" autocomplete="url">
            <button id="btn-search-feed" class="btn-primary">Search</button>
          </div>
          <div id="feed-search-status" class="search-status"></div>
          <div id="feed-search-results" class="search-results"></div>
        </div>
        <div id="add-step-details" class="add-step" style="display:none">
          <label>Feed Title</label>
          <input type="text" id="input-feed-title" placeholder="Feed name">
          <label>Folder</label>
          <div class="input-row">
            <input type="text" id="input-feed-folder" placeholder="Uncategorized" list="folder-list">
            <datalist id="folder-list"></datalist>
          </div>
          <div class="modal-actions">
            <button id="btn-back-url" class="btn-secondary">Back</button>
            <button id="btn-save-feed" class="btn-primary">Add Feed</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Menu dropdown -->
  <div id="dropdown-menu" class="dropdown" style="display:none">
    <button data-action="import-opml">Import OPML</button>
    <button data-action="export-opml">Export OPML</button>
    <hr>
    <button data-action="manage-feeds">Manage Feeds</button>
  </div>

  <!-- Manage feeds modal -->
  <div id="modal-manage" class="modal-overlay">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2>Manage Feeds</h2>
        <button class="modal-close" data-close="modal-manage">&times;</button>
      </div>
      <div class="modal-body">
        <div id="manage-feed-list" class="manage-feed-list"></div>
      </div>
    </div>
  </div>

  <!-- Read list picker modal -->
  <div id="modal-readlist-pick" class="modal-overlay">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Save to...</h2>
        <button class="modal-close" data-close="modal-readlist-pick">&times;</button>
      </div>
      <div class="modal-body">
        <div id="readlist-pick-list"></div>
      </div>
    </div>
  </div>

  <input type="file" id="file-opml" accept=".opml,.xml" style="display:none">

  <script src="assets/app.js"></script>
</body>
</html>
